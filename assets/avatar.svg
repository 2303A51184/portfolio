<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280">
  <defs>
    <linearGradient id="avatarGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Outer Glow -->
  <circle cx="140" cy="140" r="115" fill="none" stroke="url(#avatarGlow)" stroke-width="2" opacity="0.3" stroke-dasharray="6 8"/>
  <circle cx="140" cy="140" r="105" fill="none" stroke="url(#avatarGlow)" stroke-width="3" filter="url(#glow)" opacity="0.7"/>

  <!-- Core Circle Container -->
  <circle cx="140" cy="140" r="95" fill="url(#avatarBg)" stroke="url(#avatarGlow)" stroke-width="2.5"/>

  <!-- Subtle Geometric Grid Lines -->
  <line x1="85" y1="140" x2="195" y2="140" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="140" y1="85" x2="140" y2="195" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <circle cx="140" cy="140" r="60" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Monogram Initials -->
  <text x="140" y="152" text-anchor="middle" dominant-baseline="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="64" fill="url(#avatarGlow)" letter-spacing="-1">ST</text>

  <!-- Technical Orbiting Badges/Dots -->
  <circle cx="218" cy="85" r="5" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="62" cy="195" r="4" fill="#a855f7" filter="url(#glow)"/>
</svg>
